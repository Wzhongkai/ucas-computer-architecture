<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="720" height="410" style="background:#ffffff;font-family:'Microsoft YaHei',sans-serif;">
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">习题 2.2：Amdahl 定律加速比 y 与向量化百分比 x 的关系曲线 (y = 1 / (1 - 7x/8))</text>
  <!-- Horizontal Grid Lines (y = 1.0 to 8.0) -->
  <line x1="80" y1="340" x2="640" y2="340" stroke="#e2e8f0" stroke-width="1"/><text x="68" y="344" text-anchor="end" font-size="12" fill="#475569">1.0</text>
  <line x1="80" y1="300" x2="640" y2="300" stroke="#e2e8f0" stroke-width="1"/><text x="68" y="304" text-anchor="end" font-size="12" fill="#475569">2.0</text>
  <line x1="80" y1="260" x2="640" y2="260" stroke="#e2e8f0" stroke-width="1"/><text x="68" y="264" text-anchor="end" font-size="12" fill="#475569">3.0</text>
  <line x1="80" y1="220" x2="640" y2="220" stroke="#e2e8f0" stroke-width="1"/><text x="68" y="224" text-anchor="end" font-size="12" fill="#475569">4.0</text>
  <line x1="80" y1="180" x2="640" y2="180" stroke="#e2e8f0" stroke-width="1"/><text x="68" y="184" text-anchor="end" font-size="12" fill="#475569">5.0</text>
  <line x1="80" y1="140" x2="640" y2="140" stroke="#e2e8f0" stroke-width="1"/><text x="68" y="144" text-anchor="end" font-size="12" fill="#475569">6.0</text>
  <line x1="80" y1="100" x2="640" y2="100" stroke="#e2e8f0" stroke-width="1"/><text x="68" y="104" text-anchor="end" font-size="12" fill="#475569">7.0</text>
  <line x1="80" y1="60"  x2="640" y2="60"  stroke="#e2e8f0" stroke-width="1"/><text x="68" y="64"  text-anchor="end" font-size="12" fill="#475569">8.0</text>
  <!-- Vertical Grid Lines (x = 0% to 100%) -->
  <line x1="80"  y1="60" x2="80"  y2="340" stroke="#e2e8f0" stroke-width="1"/><text x="80"  y="360" text-anchor="middle" font-size="12" fill="#475569">0%</text>
  <line x1="136" y1="60" x2="136" y2="340" stroke="#e2e8f0" stroke-width="1"/><text x="136" y="360" text-anchor="middle" font-size="12" fill="#475569">10%</text>
  <line x1="192" y1="60" x2="192" y2="340" stroke="#e2e8f0" stroke-width="1"/><text x="192" y="360" text-anchor="middle" font-size="12" fill="#475569">20%</text>
  <line x1="248" y1="60" x2="248" y2="340" stroke="#e2e8f0" stroke-width="1"/><text x="248" y="360" text-anchor="middle" font-size="12" fill="#475569">30%</text>
  <line x1="304" y1="60" x2="304" y2="340" stroke="#e2e8f0" stroke-width="1"/><text x="304" y="360" text-anchor="middle" font-size="12" fill="#475569">40%</text>
  <line x1="360" y1="60" x2="360" y2="340" stroke="#e2e8f0" stroke-width="1"/><text x="360" y="360" text-anchor="middle" font-size="12" fill="#475569">50%</text>
  <line x1="416" y1="60" x2="416" y2="340" stroke="#e2e8f0" stroke-width="1"/><text x="416" y="360" text-anchor="middle" font-size="12" fill="#475569">60%</text>
  <line x1="472" y1="60" x2="472" y2="340" stroke="#e2e8f0" stroke-width="1"/><text x="472" y="360" text-anchor="middle" font-size="12" fill="#475569">70%</text>
  <line x1="528" y1="60" x2="528" y2="340" stroke="#e2e8f0" stroke-width="1"/><text x="528" y="360" text-anchor="middle" font-size="12" fill="#475569">80%</text>
  <line x1="584" y1="60" x2="584" y2="340" stroke="#e2e8f0" stroke-width="1"/><text x="584" y="360" text-anchor="middle" font-size="12" fill="#475569">90%</text>
  <line x1="640" y1="60" x2="640" y2="340" stroke="#e2e8f0" stroke-width="1"/><text x="640" y="360" text-anchor="middle" font-size="12" fill="#475569">100%</text>
  <!-- Axes -->
  <line x1="80" y1="340" x2="655" y2="340" stroke="#334155" stroke-width="2"/>
  <line x1="80" y1="340" x2="80"  y2="45"  stroke="#334155" stroke-width="2"/>
  <text x="360" y="390" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">向量化百分比 x (%)</text>
  <text x="25"  y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b" transform="rotate(-90 25 200)">系统总加速比 y</text>
  <!-- Curve y = 1 / (1 - 0.875x) -->
  <polyline fill="none" stroke="#2563eb" stroke-width="3" points="80.0,340.0 108.0,338.2 136.0,336.2 164.0,333.9 192.0,331.5 220.0,328.8 248.0,325.7 276.0,322.3 304.0,318.5 332.0,314.1 360.0,309.0 388.0,303.2 400.0,300.0 416.0,296.4 444.0,288.2 472.0,276.8 500.0,263.6 528.0,246.7 556.0,224.2 584.0,192.9 600.8,167.2 612.0,145.8 626.0,111.1 640.0,60.0"/>
  <!-- Highlight Point 1: (57.14%, 2.0) -->
  <line x1="400" y1="340" x2="400" y2="300" stroke="#dc2626" stroke-dasharray="4,4" stroke-width="1.5"/>
  <line x1="80"  y1="300" x2="400" y2="300" stroke="#dc2626" stroke-dasharray="4,4" stroke-width="1.5"/>
  <circle cx="400" cy="300" r="5" fill="#dc2626"/>
  <text x="392" y="290" text-anchor="end" font-size="12" font-weight="bold" fill="#dc2626">(57.14%, 加速比 2.0)</text>
  <!-- Highlight Point 2: (75.0%, 2.91) -->
  <line x1="500" y1="340" x2="500" y2="263.6" stroke="#059669" stroke-dasharray="4,4" stroke-width="1.5"/>
  <line x1="80"  y1="263.6" x2="500" y2="263.6" stroke="#059669" stroke-dasharray="4,4" stroke-width="1.5"/>
  <circle cx="500" cy="263.6" r="5" fill="#059669"/>
  <text x="490" y="253" text-anchor="end" font-size="12" font-weight="bold" fill="#059669">(75.0%, 加速比 2.91)</text>
  <!-- Highlight Point 3: (100%, 8.0) -->
  <circle cx="640" cy="60" r="5" fill="#2563eb"/>
  <text x="630" y="75" text-anchor="end" font-size="12" font-weight="bold" fill="#2563eb">(100%, 加速比 8.0)</text>
</svg>