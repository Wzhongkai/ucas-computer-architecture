<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 400" width="740" height="400" style="background:#ffffff;font-family:'Microsoft YaHei',sans-serif;">
  <text x="370" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">习题 2.4：单个合格晶片相对成本 y/c 与晶片面积 S 的关系曲线 (a = 4)</text>

  <!-- Grid lines: x from 0.5 to 4.0 cm^2 (x0=80 to 640, step 0.5 -> 80px), y from 0 to 30c (y0=330 to 60, 10c -> 90px) -->
  <line x1="80" y1="330" x2="640" y2="330" stroke="#e2e8f0" stroke-width="1"/><text x="68" y="334" text-anchor="end" font-size="12" fill="#475569">0</text>
  <line x1="80" y1="285" x2="640" y2="285" stroke="#e2e8f0" stroke-width="1"/><text x="68" y="289" text-anchor="end" font-size="12" fill="#475569">5c</text>
  <line x1="80" y1="240" x2="640" y2="240" stroke="#e2e8f0" stroke-width="1"/><text x="68" y="244" text-anchor="end" font-size="12" fill="#475569">10c</text>
  <line x1="80" y1="195" x2="640" y2="195" stroke="#e2e8f0" stroke-width="1"/><text x="68" y="199" text-anchor="end" font-size="12" fill="#475569">15c</text>
  <line x1="80" y1="150" x2="640" y2="150" stroke="#e2e8f0" stroke-width="1"/><text x="68" y="154" text-anchor="end" font-size="12" fill="#475569">20c</text>
  <line x1="80" y1="105" x2="640" y2="105" stroke="#e2e8f0" stroke-width="1"/><text x="68" y="109" text-anchor="end" font-size="12" fill="#475569">25c</text>
  <line x1="80" y1="60"  x2="640" y2="60"  stroke="#e2e8f0" stroke-width="1"/><text x="68" y="64"  text-anchor="end" font-size="12" fill="#475569">30c</text>

  <line x1="80"  y1="60" x2="80"  y2="330" stroke="#e2e8f0" stroke-width="1"/><text x="80"  y="350" text-anchor="middle" font-size="12" fill="#475569">0.5</text>
  <line x1="160" y1="60" x2="160" y2="330" stroke="#e2e8f0" stroke-width="1"/><text x="160" y="350" text-anchor="middle" font-size="12" fill="#475569">1.0</text>
  <line x1="240" y1="60" x2="240" y2="330" stroke="#e2e8f0" stroke-width="1"/><text x="240" y="350" text-anchor="middle" font-size="12" fill="#475569">1.5</text>
  <line x1="320" y1="60" x2="320" y2="330" stroke="#e2e8f0" stroke-width="1"/><text x="320" y="350" text-anchor="middle" font-size="12" fill="#475569">2.0</text>
  <line x1="400" y1="60" x2="400" y2="330" stroke="#e2e8f0" stroke-width="1"/><text x="400" y="350" text-anchor="middle" font-size="12" fill="#475569">2.5</text>
  <line x1="480" y1="60" x2="480" y2="330" stroke="#e2e8f0" stroke-width="1"/><text x="480" y="350" text-anchor="middle" font-size="12" fill="#475569">3.0</text>
  <line x1="560" y1="60" x2="560" y2="330" stroke="#e2e8f0" stroke-width="1"/><text x="560" y="350" text-anchor="middle" font-size="12" fill="#475569">3.5</text>
  <line x1="640" y1="60" x2="640" y2="330" stroke="#e2e8f0" stroke-width="1"/><text x="640" y="350" text-anchor="middle" font-size="12" fill="#475569">4.0</text>

  <!-- Axes -->
  <line x1="80" y1="330" x2="655" y2="330" stroke="#334155" stroke-width="2"/>
  <line x1="80" y1="330" x2="80"  y2="45"  stroke="#334155" stroke-width="2"/>
  <text x="360" y="382" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">单个晶片面积 S (cm²)</text>
  <text x="25"  y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b" transform="rotate(-90 25 195)">单个合格晶片成本 y (单位: c)</text>

  <!-- Ideal 100% Yield linear cost: y = c * S (from S=0.5->325.5 to S=4.0->294.0) -->
  <line x1="80" y1="325.5" x2="640" y2="294.0" stroke="#94a3b8" stroke-dasharray="5,5" stroke-width="2"/>
  <text x="635" y="312" text-anchor="end" font-size="12" fill="#64748b">理想 100% 良率毛坯成本: y = c·S</text>

  <!-- Actual cost curve for b = 0.6/cm^2: y/c = S*(1+0.15S)^4 -->
  <!-- S=0.5: 0.668(y=324.0), S=1.0: 1.749(y=314.3), S=1.5: 3.381(y=299.6), S=2.0: 5.717(y=278.5), S=2.5: 8.943(y=249.5), S=3.0: 13.263(y=210.6), S=3.5: 18.905(y=159.9), S=4.0: 26.214(y=94.1) -->
  <polyline fill="none" stroke="#2563eb" stroke-width="3" points="80,324.0 160,314.3 240,299.6 320,278.5 400,249.5 480,210.6 560,159.9 640,94.1"/>
  <circle cx="80"  cy="324.0" r="4.5" fill="#2563eb"/>
  <circle cx="160" cy="314.3" r="4.5" fill="#2563eb"/><text x="160" y="302" text-anchor="middle" font-size="11" fill="#1e40af">1.75c</text>
  <circle cx="240" cy="299.6" r="4.5" fill="#2563eb"/>
  <circle cx="320" cy="278.5" r="4.5" fill="#2563eb"/><text x="315" y="266" text-anchor="end" font-size="11" font-weight="bold" fill="#1e40af">5.72c (良率35%)</text>
  <circle cx="400" cy="249.5" r="4.5" fill="#2563eb"/>
  <circle cx="480" cy="210.6" r="4.5" fill="#2563eb"/><text x="470" y="198" text-anchor="end" font-size="11" fill="#1e40af">13.26c</text>
  <circle cx="560" cy="159.9" r="4.5" fill="#2563eb"/>
  <circle cx="640" cy="94.1"  r="4.5" fill="#2563eb"/><text x="630" y="84"  text-anchor="end" font-size="12" font-weight="bold" fill="#2563eb">26.21c (良率15.3%)</text>

  <!-- Legend box -->
  <rect x="110" y="75" width="325" height="65" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="125" y="98"  font-size="12" font-weight="bold" fill="#2563eb">● 缺陷密度 b = 0.6/cm²: y = c·S·(1 + 0.15S)⁴</text>
  <text x="125" y="122" font-size="12" fill="#475569">核心规律: 合格晶片成本随面积 S 的 (a+1)=5 次方增长</text>
</svg>