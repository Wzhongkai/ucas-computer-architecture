<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 340" width="740" height="340" style="background:#ffffff;font-family:'Microsoft YaHei',sans-serif;">
  <text x="370" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">习题 11.4(3)：两级层次化页表逻辑地址转换示意图 (以 32 位虚拟地址、4KB 页为例)</text>
  <text x="60" y="65" font-size="13" font-weight="bold" fill="#334155">32 位虚拟地址 (VA):</text>
  <rect x="60" y="75" width="110" height="36" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">p1 (10 位)</text>
  <rect x="170" y="75" width="110" height="36" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="225" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">p2 (10 位)</text>
  <rect x="280" y="75" width="120" height="36" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="340" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">页内偏移 d (12 位)</text>
  <rect x="140" y="150" width="150" height="150" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="215" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">一级页目录表 (4KB)</text>
  <rect x="155" y="210" width="120" height="28" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="215" y="229" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">二级页表基址</text>
  <text x="215" y="275" text-anchor="middle" font-size="11" fill="#475569">(未用区间无需分配下级表)</text>
  <rect x="350" y="150" width="150" height="150" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="425" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">二级页表 (4KB/张)</text>
  <rect x="365" y="225" width="120" height="28" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <text x="425" y="244" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">物理页帧号 PFN</text>
  <rect x="560" y="150" width="140" height="150" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="630" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">物理内存页 (4KB)</text>
  <rect x="575" y="240" width="110" height="28" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="630" y="259" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">目标物理字节</text>
  <polyline fill="none" stroke="#2563eb" stroke-width="2" points="115,111 115,224 155,224"/>
  <polyline fill="none" stroke="#2563eb" stroke-width="2" points="275,224 315,224 315,155 350,155"/>
  <polyline fill="none" stroke="#d97706" stroke-width="2" points="225,111 225,135 330,135 330,239 365,239"/>
  <polyline fill="none" stroke="#d97706" stroke-width="2" points="485,239 525,239 525,155 560,155"/>
  <polyline fill="none" stroke="#16a34a" stroke-width="2" points="340,111 340,125 540,125 540,254 575,254"/>
</svg>