<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" style="background:#ffffff;font-family:'Microsoft YaHei',sans-serif;">
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">习题 9.7：由 21 个 4 位 CLA 模块（图 9.5）组建的 64 位三级先行进位逻辑层次框图</text>

  <!-- Level 3: 1 top 4-bit CLA block -->
  <rect x="230" y="50" width="300" height="58" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="380" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#9d174d">第 3 层 (顶层: 1 个 4 位 CLA 模块)</text>
  <text x="380" y="94" text-anchor="middle" font-size="11" fill="#831843">输入: P^(2)_[3:0], G^(2)_[3:0], c_0  |  输出: c_48, c_32, c_16</text>

  <!-- Arrows Level 3 <-> Level 2 -->
  <line x1="270" y1="108" x2="115" y2="150" stroke="#db2777" stroke-width="2"/>
  <line x1="340" y1="108" x2="292" y2="150" stroke="#db2777" stroke-width="2"/>
  <line x1="420" y1="108" x2="468" y2="150" stroke="#db2777" stroke-width="2"/>
  <line x1="490" y1="108" x2="645" y2="150" stroke="#db2777" stroke-width="2"/>

  <!-- Level 2: 4 middle 4-bit CLA blocks -->
  <rect x="35"  y="150" width="160" height="62" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="115" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">第 2 层 CLA_2,3 [63:48]</text>
  <text x="115" y="191" text-anchor="middle" font-size="10" fill="#b45309">输入 c_48 | 输出 c_60, c_56, c_52</text>
  <text x="115" y="205" text-anchor="middle" font-size="10" fill="#b45309">向上输出 P^(2)_3, G^(2)_3</text>

  <rect x="212" y="150" width="160" height="62" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="292" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">第 2 层 CLA_2,2 [47:32]</text>
  <text x="292" y="191" text-anchor="middle" font-size="10" fill="#b45309">输入 c_32 | 输出 c_44, c_40, c_36</text>
  <text x="292" y="205" text-anchor="middle" font-size="10" fill="#b45309">向上输出 P^(2)_2, G^(2)_2</text>

  <rect x="388" y="150" width="160" height="62" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="468" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">第 2 层 CLA_2,1 [31:16]</text>
  <text x="468" y="191" text-anchor="middle" font-size="10" fill="#b45309">输入 c_16 | 输出 c_28, c_24, c_20</text>
  <text x="468" y="205" text-anchor="middle" font-size="10" fill="#b45309">向上输出 P^(2)_1, G^(2)_1</text>

  <rect x="565" y="150" width="160" height="62" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="645" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">第 2 层 CLA_2,0 [15:0]</text>
  <text x="645" y="191" text-anchor="middle" font-size="10" fill="#b45309">输入 c_0  | 输出 c_12, c_8, c_4</text>
  <text x="645" y="205" text-anchor="middle" font-size="10" fill="#b45309">向上输出 P^(2)_0, G^(2)_0</text>

  <!-- Arrows Level 2 <-> Level 1 -->
  <line x1="115" y1="212" x2="115" y2="255" stroke="#2563eb" stroke-width="2"/>
  <line x1="292" y1="212" x2="292" y2="255" stroke="#2563eb" stroke-width="2"/>
  <line x1="468" y1="212" x2="468" y2="255" stroke="#2563eb" stroke-width="2"/>
  <line x1="645" y1="212" x2="645" y2="255" stroke="#2563eb" stroke-width="2"/>

  <!-- Level 1: 16 bottom 4-bit CLA blocks (4 groups of 4) -->
  <rect x="35"  y="255" width="160" height="72" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="277" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">第 1 层: 4 个 4 位 CLA</text>
  <text x="115" y="295" text-anchor="middle" font-size="10" fill="#1e40af">处理位 [63:60] ~ [51:48]</text>
  <text x="115" y="313" text-anchor="middle" font-size="10" fill="#1e40af">输出全部组内进位 c_63 ~ c_49</text>

  <rect x="212" y="255" width="160" height="72" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="292" y="277" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">第 1 层: 4 个 4 位 CLA</text>
  <text x="292" y="295" text-anchor="middle" font-size="10" fill="#1e40af">处理位 [47:44] ~ [35:32]</text>
  <text x="292" y="313" text-anchor="middle" font-size="10" fill="#1e40af">输出全部组内进位 c_47 ~ c_33</text>

  <rect x="388" y="255" width="160" height="72" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="468" y="277" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">第 1 层: 4 个 4 位 CLA</text>
  <text x="468" y="295" text-anchor="middle" font-size="10" fill="#1e40af">处理位 [31:28] ~ [19:16]</text>
  <text x="468" y="313" text-anchor="middle" font-size="10" fill="#1e40af">输出全部组内进位 c_31 ~ c_17</text>

  <rect x="565" y="255" width="160" height="72" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="645" y="277" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">第 1 层: 4 个 4 位 CLA</text>
  <text x="645" y="295" text-anchor="middle" font-size="10" fill="#1e40af">处理位 [15:12] ~ [3:0]</text>
  <text x="645" y="313" text-anchor="middle" font-size="10" fill="#1e40af">输出全部组内进位 c_15 ~ c_1</text>
</svg>